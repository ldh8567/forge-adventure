function strike(cx,cy,r,mult,col){
 fx.push({x:cx,y:cy,r:Math.max(10,r),t:.28,c:col||'#fff',ring:1});

 let hit=0;

  if(!m.boss){const a=Math.atan2(m.y-p.y,m.x-p.x);m.x+=Math.cos(a)*5;m.y+=Math.sin(a)*5}
  num(m.x,m.y-16*m.s,(cr?'치명! ':'')+d,cr?'#f9f':'#ff8');burst(m.x,m.y-6,col);sh=Math.max(sh,m.boss?2:1);SFX.hit();

 mobs=mobs.filter(m=>!m.dead);return hit}
